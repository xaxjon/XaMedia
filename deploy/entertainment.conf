<VirtualHost *:80>
    ServerName entertainment.local
    DocumentRoot /var/www/entertainment/public
    <Directory /var/www/entertainment/public>
        Require all granted
        AllowOverride None
        DirectoryIndex index.php
    </Directory>

    # Media files served straight off the read-only NFS mount.
    Alias /media /mnt/library
    <Directory /mnt/library>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/entertainment-error.log
    CustomLog ${APACHE_LOG_DIR}/entertainment-access.log combined
</VirtualHost>
